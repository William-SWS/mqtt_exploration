[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mqtt-investigation"
version = "0.1.0"
description = "Experimentos reproduzíveis de detecção de intrusão MQTT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.3"]

[project.scripts]
mqtt-ids = "mqtt_ids.cli:main"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.14.14"]
notebook = ["ipykernel>=7.2.0", "jupyterlab>=4.5.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/mqtt_ids"]
